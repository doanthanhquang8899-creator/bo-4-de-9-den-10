</style><body><header><a href="#" id="logo">✦ <b>GDQP<span>&</span>AN</b><small>KHÔNG GIAN ÔN LUYỆN</small></a><button id="home">Tổng quan ↗</button></header><main id="app"></main><footer>Học chắc kiến thức · Vững vàng bước vào hội thi<br>Chấm theo đáp án trong tài liệu gốc. Chưa thẩm định tính chính xác và hiệu lực các nội dung.</footer><script>const QUESTIONS=[{"id": 1, "set": 9, "number": 1, "level": "Nhận biết", "text": "Thông tư số 46/2020/TT-BGDĐT ban hành Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông do ai ban hành?", "options": ["Bộ trưởng Bộ Quốc phòng", "Bộ trưởng Bộ Công an", "Thủ tướng Chính phủ", "Bộ trưởng Bộ Giáo dục và Đào tạo"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, phần căn cứ ban hành.", "explanation": ""}, {"id": 2, "set": 9, "number": 2, "level": "Nhận biết", "text": "Thông tư số 46/2020/TT-BGDĐT thay thế văn bản nào?", "options": ["Thông tư số 01/2018/TT-BGDĐT ngày 26/01/2018", "Thông tư số 26/2020/TT-BGDĐT ngày 26/8/2020", "Thông tư số 58/2011/TT-BGDĐT ngày 12/12/2011", "Thông tư số 02/2017/TT-BGDĐT ngày 13/01/2017"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Điều 3.", "explanation": ""}, {"id": 3, "set": 9, "number": 3, "level": "Nhận biết", "text": "Theo Chương trình, nội dung “Đội ngũ từng người không có súng” ở lớp 10 có thời lượng bao nhiêu tiết?", "options": ["3 tiết thực hành", "4 tiết lí thuyết", "4 tiết thực hành", "2 tiết lí thuyết"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 10).", "explanation": ""}, {"id": 4, "set": 9, "number": 4, "level": "Nhận biết", "text": "Theo bảng nội dung khái quát của Chương trình, chủ đề “Một số hiểu biết chung về quốc phòng và an ninh” gồm bao nhiêu nội dung?", "options": ["14 nội dung", "12 nội dung", "16 nội dung", "18 nội dung"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.1.", "explanation": ""}, {"id": 5, "set": 9, "number": 5, "level": "Nhận biết", "text": "Theo Chương trình, nội dung “Kĩ thuật bắn súng tiểu liên AK” được dạy ở lớp nào?", "options": ["Lớp 12", "Lớp 11", "Cả ba lớp", "Lớp 10"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.1, V.2.", "explanation": ""}, {"id": 6, "set": 9, "number": 6, "level": "Nhận biết", "text": "Theo Chương trình, mỗi lớp (10, 11, 12) dành bao nhiêu tiết cho kiểm tra?", "options": ["3 tiết, gồm 2 tiết lí thuyết và 1 tiết thực hành", "4 tiết, gồm 2 tiết lí thuyết và 2 tiết thực hành", "4 tiết, toàn bộ là tiết thực hành", "2 tiết, gồm 1 tiết lí thuyết và 1 tiết thực hành"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2.", "explanation": ""}, {"id": 7, "set": 9, "number": 7, "level": "Nhận biết", "text": "Theo Chương trình, thời lượng môn Giáo dục quốc phòng và an ninh ở mỗi lớp của cấp trung học phổ thông là bao nhiêu tiết?", "options": ["70 tiết", "45 tiết", "35 tiết", "30 tiết"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.2.1.", "explanation": ""}, {"id": 8, "set": 9, "number": 8, "level": "Nhận biết", "text": "Theo Chương trình, nội dung “Kiến thức phổ thông về phòng không nhân dân” ở lớp 11 có thời lượng bao nhiêu tiết?", "options": ["4 tiết thực hành", "3 tiết lí thuyết", "3 tiết thực hành", "2 tiết lí thuyết"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 11).", "explanation": ""}, {"id": 9, "set": 9, "number": 9, "level": "Thông hiểu", "text": "Theo Điều 2 Thông tư số 46/2020/TT-BGDĐT, Thông tư áp dụng đối với những đối tượng nào?", "options": ["Trường tiểu học, trường trung học cơ sở, trường trung học phổ thông và các trung tâm giáo dục thường xuyên trong cả nước", "Trường của lực lượng vũ trang nhân dân, trường của tổ chức chính trị, tổ chức chính trị – xã hội ở trung ương và địa phương", "Trường cao đẳng, cơ sở giáo dục đại học và các trung tâm giáo dục quốc phòng và an ninh thuộc nhà trường quân đội", "Trường trung học phổ thông, trường phổ thông nhiều cấp học có cấp trung học phổ thông và tổ chức, cá nhân có liên quan"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Điều 2.", "explanation": ""}, {"id": 10, "set": 9, "number": 10, "level": "Thông hiểu", "text": "Theo phần đặc điểm môn học, ở cấp tiểu học và trung học cơ sở, giáo dục quốc phòng và an ninh bảo đảm cho học sinh điều gì?", "options": ["Hình thành những hiểu biết ban đầu về truyền thống dựng nước và giữ nước, về lực lượng vũ trang nhân dân", "Có trình độ tương đương hạ sĩ quan dự bị, đủ điều kiện bổ sung cho lực lượng thường trực của Quân đội nhân dân", "Thành thạo kĩ thuật bắn súng tiểu liên AK, sử dụng lựu đạn và các tư thế, động tác vận động trong chiến đấu", "Có kiến thức cơ bản, cần thiết về phòng thủ dân sự và kĩ năng quân sự; sẵn sàng thực hiện nghĩa vụ quân sự bảo vệ Tổ quốc"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục I.", "explanation": ""}, {"id": 11, "set": 9, "number": 11, "level": "Thông hiểu", "text": "Quan điểm “phát triển phẩm chất, năng lực chung, năng lực đặc thù” trong xây dựng Chương trình được thể hiện như thế nào?", "options": ["Lấy khối lượng kiến thức cần truyền thụ làm cơ sở duy nhất để lựa chọn nội dung giáo dục cho từng lớp", "Căn cứ yêu cầu cần đạt về phẩm chất, năng lực làm cơ sở để lựa chọn nội dung giáo dục", "Lấy thành tích hội thao của nhà trường làm xuất phát điểm để xây dựng nội dung giáo dục hằng năm", "Lấy nguyện vọng của cha mẹ học sinh làm căn cứ để lựa chọn và sắp xếp nội dung giáo dục"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục II.2.", "explanation": ""}, {"id": 12, "set": 9, "number": 12, "level": "Thông hiểu", "text": "Theo Chương trình, yêu cầu cần đạt về các phẩm chất chủ yếu và năng lực chung của môn học được xác định theo đâu?", "options": ["Theo các mức độ quy định trong Chương trình tổng thể", "Theo quy định riêng do từng trường trung học phổ thông tự xây dựng và ban hành", "Theo điều lệnh quản lý bộ đội và điều lệnh đội ngũ của Quân đội nhân dân Việt Nam", "Theo kế hoạch huấn luyện hằng năm của cơ quan quân sự địa phương nơi trường đóng"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục IV.1.", "explanation": ""}, {"id": 13, "set": 9, "number": 13, "level": "Thông hiểu", "text": "Yêu cầu cần đạt nào sau đây thuộc năng lực “nhận thức các vấn đề về quốc phòng, an ninh”?", "options": ["Thực hiện được trách nhiệm công dân trong việc bảo vệ và xây dựng Tổ quốc phù hợp với lứa tuổi", "Trình bày được vai trò, nhiệm vụ quốc phòng, an ninh trong xây dựng và bảo vệ Tổ quốc", "Biết vận dụng kiến thức về phòng thủ dân sự, kiến thức phổ thông về phòng không nhân dân trong cuộc sống", "Thực hiện được một số kĩ năng cơ bản về phòng không nhân dân trong học tập và cuộc sống"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục IV.2.", "explanation": ""}, {"id": 14, "set": 9, "number": 14, "level": "Thông hiểu", "text": "Yêu cầu cần đạt nào sau đây thuộc năng lực “vận dụng kiến thức, kĩ năng quân sự đã học vào cuộc sống”?", "options": ["Nêu được quy định của pháp luật về các nhiệm vụ quốc phòng toàn dân, an ninh nhân dân", "Nêu được các nội dung phòng không nhân dân, phòng chống bom, mìn, vũ khí hoá học, sinh học", "Trình bày được lịch sử, truyền thống của lực lượng vũ trang nhân dân Việt Nam qua các thời kì", "Nhận diện được âm mưu, thủ đoạn của các thế lực thù địch, tội phạm"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục IV.2.", "explanation": ""}, {"id": 15, "set": 9, "number": 15, "level": "Thông hiểu", "text": "Theo bảng nội dung khái quát, chủ đề “Điều lệnh đội ngũ” gồm những nội dung nào?", "options": ["Điều lệnh quản lý bộ đội và Điều lệnh Công an nhân dân; Đội ngũ từng người không có súng; Đội ngũ tiểu đội", "Đội ngũ từng người không có súng; Đội ngũ từng người có súng; Đội ngũ tiểu đội; Đội ngũ trung đội; Đội ngũ đại đội", "Các tư thế, động tác cơ bản vận động trong chiến đấu; Lợi dụng địa hình, địa vật; Tìm và giữ phương hướng", "Kĩ thuật sử dụng lựu đạn; Kĩ thuật bắn súng tiểu liên AK; Chạy vũ trang; Đội ngũ tiểu đội"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.1.", "explanation": ""}, {"id": 16, "set": 9, "number": 16, "level": "Thông hiểu", "text": "Theo bảng nội dung khái quát, chủ đề “Kĩ thuật chiến đấu bộ binh” gồm những nội dung nào?", "options": ["Kĩ thuật sử dụng lựu đạn; Kĩ thuật cấp cứu và chuyển thương; Thường thức phòng tránh bom, mìn, đạn; Chạy vũ trang", "Súng bộ binh, thuốc nổ, vật cản và vũ khí tự tạo; Kĩ thuật sử dụng lựu đạn; Kĩ thuật bắn súng tiểu liên AK; Chạy vũ trang", "Đội ngũ từng người không có súng; Đội ngũ tiểu đội; Kĩ thuật cấp cứu và chuyển thương; Kiến thức phổ thông về phòng không nhân dân", "Lợi dụng địa hình, địa vật; Tìm và giữ phương hướng; Nhìn, nghe, phát hiện địch; Vận dụng các tư thế, động tác khi vận động trong chiến đấu"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.1.", "explanation": ""}, {"id": 17, "set": 9, "number": 17, "level": "Thông hiểu", "text": "Yêu cầu cần đạt nào sau đây thuộc nội dung “Lịch sử, truyền thống của lực lượng vũ trang nhân dân Việt Nam” ở lớp 10?", "options": ["Từ truyền thống anh hùng của lực lượng vũ trang rút ra được nét cơ bản của nghệ thuật quân sự Việt Nam", "Nêu được hệ thống nhà trường trong Quân đội, Công an và công tác tuyển sinh vào các trường quân đội, công an", "Nêu được giá trị lịch sử và nghệ thuật quân sự Việt Nam trong hai cuộc chiến tranh bảo vệ biên giới của Tổ quốc", "Nêu được một số nét chính về truyền thống và nghệ thuật quân sự của lực lượng vũ trang địa phương"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 10).", "explanation": ""}, {"id": 18, "set": 9, "number": 18, "level": "Thông hiểu", "text": "Yêu cầu cần đạt nào sau đây thuộc nội dung “Một số hiểu biết về an ninh mạng” ở lớp 10?", "options": ["Biết tuyên truyền, vận động người thân không tàng trữ, buôn bán, sử dụng vũ khí trái pháp luật", "Nêu được hình thức, cách thức hoạt động của các loại tội phạm, đặc biệt là tội phạm công nghệ cao ở Việt Nam", "Bảo mật được thông tin cá nhân, cảnh giác trước thủ đoạn xâm nhập, phát tán mã độc, thông tin giả", "Biết cách phòng, chống âm mưu, thủ đoạn “diễn biến hoà bình” trên các trang mạng xã hội"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 10).", "explanation": ""}, {"id": 19, "set": 9, "number": 19, "level": "Thông hiểu", "text": "Yêu cầu cần đạt của nội dung “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” ở lớp 11 là gì?", "options": ["Nêu được những nội dung chính của Luật Nghĩa vụ quân sự; biết đăng ký và thực hiện nghĩa vụ quân sự", "Phân tích và trình bày được nội dung cơ bản của Luật Sĩ quan Quân đội nhân dân Việt Nam và Luật Công an nhân dân; có định hướng nghề nghiệp", "Nêu được hệ thống nhà trường trong Quân đội, Công an; định hướng học tập để theo học các ngành, nghề trong lĩnh vực quốc phòng, an ninh", "Nêu được chức năng, nhiệm vụ của một số tổ chức trong Quân đội và Công an; nhận biết được cấp bậc quân hàm, quân hiệu, phù hiệu, trang phục"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 11).", "explanation": ""}, {"id": 20, "set": 9, "number": 20, "level": "Thông hiểu", "text": "Yêu cầu cần đạt nào sau đây thuộc nội dung về chiến lược “diễn biến hoà bình”, bạo loạn lật đổ ở lớp 12?", "options": ["Nêu được tình hình bảo vệ an ninh quốc gia, bảo đảm trật tự an toàn xã hội và nhiệm vụ của công dân trong đấu tranh bảo vệ an ninh quốc gia", "Nêu được khái niệm cơ bản về mạng, an ninh mạng, bảo mật thông tin cá nhân trên không gian mạng và nội dung cơ bản của Luật An ninh mạng", "Biết cách phòng, chống âm mưu, thủ đoạn “diễn biến hoà bình”, bạo loạn lật đổ tại địa phương và trên mạng xã hội", "Nêu được một số loại hình tội phạm, tệ nạn xã hội và quy định của pháp luật về phòng chống tội phạm sử dụng công nghệ cao"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 12).", "explanation": ""}, {"id": 21, "set": 9, "number": 21, "level": "Thông hiểu", "text": "Định hướng chung về phương pháp giáo dục của Chương trình yêu cầu điều gì?", "options": ["Phát huy tính tích cực, chủ động, sáng tạo của học sinh; tránh áp đặt một chiều", "Chỉ sử dụng một phương pháp dạy học thống nhất cho tất cả các chủ đề của môn học", "Tập trung rèn luyện thể lực, hạn chế các hoạt động thảo luận, đóng vai, thực hành", "Ưu tiên truyền thụ kiến thức một chiều để bảo đảm học sinh ghi nhớ đầy đủ nội dung bài học"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VI.1.1.", "explanation": ""}, {"id": 22, "set": 9, "number": 22, "level": "Thông hiểu", "text": "Về phương tiện dạy học, Chương trình định hướng giáo viên như thế nào?", "options": ["Tận dụng tối đa các phương tiện dạy học hiện đại, công nghệ số trong giảng dạy", "Hạn chế sử dụng công nghệ số, chỉ dùng tranh vẽ và mô hình tự làm để bảo đảm tính truyền thống", "Chỉ được sử dụng vũ khí, trang bị thật; không dùng công nghệ mô phỏng, phim video trong giảng dạy", "Giao học sinh tự chuẩn bị toàn bộ phương tiện dạy học cho các bài thực hành của lớp mình"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VI.2.3.", "explanation": ""}, {"id": 23, "set": 9, "number": 23, "level": "Thông hiểu", "text": "Theo Chương trình, việc đánh giá kết quả môn Giáo dục quốc phòng và an ninh nhằm mục đích gì?", "options": ["Lựa chọn học sinh đủ điều kiện gọi nhập ngũ ngay sau khi tốt nghiệp trung học phổ thông và lập danh sách gửi cơ quan quân sự địa phương", "Ghi nhận sự tiến bộ của mỗi học sinh; cung cấp thông tin để giáo viên điều chỉnh việc dạy học", "Xác định mức phụ cấp, khen thưởng đối với giáo viên giáo dục quốc phòng và an ninh trong từng học kì và cả năm học", "Xếp hạng các trường trung học phổ thông trong tỉnh theo kết quả hội thao giáo dục quốc phòng và an ninh được tổ chức hằng năm"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VII.", "explanation": ""}, {"id": 24, "set": 9, "number": 24, "level": "Thông hiểu", "text": "Theo Chương trình, căn cứ vào chương trình năm học, các cơ sở giáo dục có trách nhiệm gì về thời lượng môn học?", "options": ["Dồn toàn bộ số tiết vào một tuần quân sự", "Tự quyết định cắt giảm số tiết của môn học", "Xây dựng kế hoạch dạy học bảo đảm đủ thời gian", "Chuyển toàn bộ số tiết sang kì nghỉ hè"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.2.1.", "explanation": ""}, {"id": 25, "set": 9, "number": 25, "level": "Vận dụng", "text": "Trường phổ thông liên cấp H có cả cấp trung học cơ sở và trung học phổ thông. Hiệu trưởng hỏi nhà trường có thuộc đối tượng áp dụng Thông tư số 46/2020/TT-BGDĐT không. Câu trả lời nào đúng?", "options": ["Không, vì Thông tư chỉ áp dụng với trường chỉ có một cấp học là trung học phổ thông", "Có, vì Thông tư áp dụng cả với trường nhiều cấp học có cấp trung học phổ thông", "Có, và Thông tư áp dụng cho cả học sinh cấp trung học cơ sở của nhà trường", "Không, vì trường liên cấp thực hiện chương trình riêng do sở giáo dục và đào tạo ban hành"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Điều 2.", "explanation": ""}, {"id": 26, "set": 9, "number": 26, "level": "Vận dụng", "text": "Khi lập kế hoạch dạy học, một giáo viên xếp nội dung “Ma tuý, tác hại của ma tuý” vào chương trình lớp 11. Đối chiếu Chương trình, cách xếp này như thế nào?", "options": ["Đúng, vì giáo viên được tự chuyển nội dung giữa các lớp học", "Chưa đúng, vì nội dung này thuộc lớp 12 với 3 tiết lí thuyết", "Đúng, vì nội dung này thuộc lớp 11 với 2 tiết lí thuyết", "Chưa đúng, vì nội dung này thuộc lớp 10 với 2 tiết lí thuyết"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.1, V.2 (lớp 10).", "explanation": ""}, {"id": 27, "set": 9, "number": 27, "level": "Vận dụng", "text": "Một giáo viên dự kiến dạy nội dung “Đội ngũ tiểu đội” ở lớp 10 gồm 2 tiết lí thuyết và 1 tiết thực hành. Đối chiếu Chương trình, dự kiến này như thế nào?", "options": ["Chưa phù hợp, vì nội dung này có 3 tiết và đều là lí thuyết", "Chưa phù hợp, vì nội dung này có 4 tiết và đều là thực hành", "Chưa phù hợp, vì nội dung này có 3 tiết và đều là thực hành", "Phù hợp, vì nội dung này có 2 tiết lí thuyết, 1 tiết thực hành"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 10).", "explanation": ""}, {"id": 28, "set": 9, "number": 28, "level": "Vận dụng", "text": "Để “dạy cho xong”, một giáo viên xếp cả 4 tiết thực hành “Kĩ thuật cấp cứu và chuyển thương” vào cùng một buổi. Đối chiếu hướng dẫn thực hiện Chương trình, cách xếp này như thế nào?", "options": ["Chưa phù hợp, vì bài thực hành chỉ được dạy mỗi buổi đúng 1 tiết trong cả năm học", "Chưa phù hợp, vì bài thực hành dạy dứt điểm theo bài nhưng không quá 3 tiết/buổi/tuần", "Phù hợp, vì bài thực hành phải dạy liền toàn bộ số tiết trong một buổi để dứt điểm", "Phù hợp, vì Chương trình không có quy định nào về số tiết thực hành mỗi buổi"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.5.1.", "explanation": ""}, {"id": 29, "set": 9, "number": 29, "level": "Vận dụng", "text": "Khi viết yêu cầu cần đạt, giáo viên dùng các động từ “phản bác”, “đấu tranh”, “đề xuất và thực hiện”. Theo bảng động từ mô tả mức độ của Chương trình, các động từ này thuộc mức nào?", "options": ["Mức Hiểu", "Không thuộc mức nào", "Mức Biết", "Mức Vận dụng"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.1.2.", "explanation": ""}, {"id": 30, "set": 9, "number": 30, "level": "Vận dụng", "text": "Giáo viên ghi nhận kết quả của học sinh thông qua hoạt động thực hành tập luyện, trình diễn và hội thảo trong quá trình học. Theo Chương trình, đây là hình thức đánh giá nào?", "options": ["Đánh giá định kì cuối năm học", "Đánh giá thường xuyên – đánh giá không chính thức", "Đánh giá thường xuyên – đánh giá chính thức", "Đánh giá định kì cuối học kì"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VII.1.", "explanation": ""}, {"id": 31, "set": 9, "number": 31, "level": "Vận dụng", "text": "Trong suốt một học kì, một giáo viên chỉ thuyết trình cho học sinh ghi chép, không tổ chức thảo luận hay thực hành. Đối chiếu định hướng phương pháp của Chương trình, nhận xét nào đúng?", "options": ["Phù hợp, vì thuyết trình là phương pháp duy nhất được Chương trình cho phép sử dụng", "Chưa phù hợp, vì Chương trình cấm hoàn toàn việc sử dụng phương pháp thuyết trình", "Phù hợp, vì Chương trình yêu cầu ưu tiên ghi nhớ đầy đủ nội dung của bài học", "Chưa phù hợp, vì phương pháp truyền thống phải phát huy tính tích cực của học sinh"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VI.1.1, VI.1.2.", "explanation": ""}, {"id": 32, "set": 9, "number": 32, "level": "Vận dụng", "text": "Khi tổ chức cho học sinh lớp 11 thực hành ném lựu đạn, yêu cầu nào được Chương trình nhấn mạnh là “đặc biệt” phải bảo đảm?", "options": ["Hoàn thành bài trong đúng một tiết học", "Sử dụng lựu đạn thật để tăng tính thực tế", "Tất cả học sinh ném đạt thành tích loại giỏi", "An toàn tuyệt đối cho người học và người dạy"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VI.2.2.", "explanation": ""}, {"id": 33, "set": 9, "number": 33, "level": "Vận dụng", "text": "Một học sinh lớp 12 muốn thi vào trường quân đội và hỏi nội dung nào của môn học giúp em định hướng. Theo Chương trình, đó là nội dung nào?", "options": ["“Một số nội dung Điều lệnh quản lý bộ đội và Điều lệnh Công an nhân dân” (2 tiết lí thuyết, thuộc lớp 12)", "“Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (2 tiết lí thuyết, thuộc chương trình lớp 12)", "“Công tác tuyển sinh, đào tạo trong các trường Quân đội nhân dân Việt Nam và Công an nhân dân Việt Nam” (lớp 12)", "“Nội dung cơ bản một số luật về quốc phòng và an ninh Việt Nam” (2 tiết lí thuyết, thuộc chương trình lớp 12)"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 12).", "explanation": ""}, {"id": 34, "set": 9, "number": 34, "level": "Vận dụng", "text": "Tổ chuyên môn cần xác định các nội dung thuộc chủ đề “Chiến thuật bộ binh” được dạy ở lớp 11. Theo Chương trình, đó là những nội dung nào?", "options": ["Lợi dụng địa hình, địa vật; Nhìn, nghe, phát hiện địch, chỉ mục tiêu, truyền tin liên lạc", "Tìm và giữ phương hướng; Vận dụng các tư thế, động tác cơ bản khi vận động trong chiến đấu", "Kĩ thuật sử dụng lựu đạn; Kĩ thuật bắn súng tiểu liên AK", "Các tư thế, động tác cơ bản vận động trong chiến đấu; Đội ngũ tiểu đội"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.1.", "explanation": ""}, {"id": 35, "set": 9, "number": 35, "level": "Vận dụng", "text": "Khi ra đề kiểm tra, cô giáo muốn thay động từ “nêu được” bằng một động từ có nghĩa tương đương cho phù hợp tình huống. Theo Chương trình, việc này có được phép không?", "options": ["Không, vì việc lựa chọn động từ trong đề kiểm tra do sở giáo dục và đào tạo quyết định", "Không, vì giáo viên chỉ được dùng đúng nguyên văn các động từ đã ghi trong bảng tổng hợp", "Được, vì giáo viên có thể thay bằng động từ có nghĩa tương đương", "Được, nhưng chỉ khi đề kiểm tra đó là đề kiểm tra thực hành ngoài bãi tập"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.1.2.", "explanation": ""}, {"id": 36, "set": 9, "number": 36, "level": "Vận dụng", "text": "Tổ chuyên môn đề xuất tổ chức hội thi, hội thao giáo dục quốc phòng và an ninh và hoạt động trải nghiệm sáng tạo cho học sinh toàn trường. Theo Chương trình, đề xuất này được nhìn nhận như thế nào?", "options": ["Phù hợp, vì đây được coi là một phương pháp giáo dục đặc thù của môn học", "Không phù hợp, vì hội thi, hội thao chỉ do cơ quan quân sự được tổ chức", "Phù hợp, nhưng chỉ được tổ chức cho học sinh lớp 12 trước khi tốt nghiệp", "Không phù hợp, vì môn học chỉ được dạy trong các tiết chính khoá trên lớp"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VI.2.4.", "explanation": ""}, {"id": 37, "set": 9, "number": 37, "level": "Vận dụng cao", "text": "Ở lớp 10, các nội dung có tiết thực hành gồm: Thường thức phòng tránh bom, mìn… (1 tiết); Đội ngũ từng người không có súng (4 tiết); Đội ngũ tiểu đội (3 tiết); Các tư thế, động tác cơ bản vận động trong chiến đấu (3 tiết); Kĩ thuật cấp cứu và chuyển thương (4 tiết). Không tính kiểm tra, tổng số tiết thực hành của lớp 10 là bao nhiêu và chiếm bao nhiêu trong 17 tiết thực hành của cả năm?", "options": ["14 tiết; 3 tiết còn lại là kiểm tra thực hành", "17 tiết; không có tiết kiểm tra thực hành", "13 tiết; 4 tiết còn lại là kiểm tra thực hành", "15 tiết; 2 tiết còn lại là kiểm tra thực hành"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 10): 1 + 4 + 3 + 3 + 4 = 15; kiểm tra 2 tiết thực hành.", "explanation": ""}, {"id": 38, "set": 9, "number": 38, "level": "Vận dụng cao", "text": "Cho ba nhận định về thời lượng trong Chương trình: (1) nội dung có thời lượng lớn nhất ở lớp 11 là “Giới thiệu một số loại súng bộ binh, thuốc nổ, vật cản và vũ khí tự tạo” (7 tiết); (2) nội dung có thời lượng lớn nhất ở lớp 12 là “Kĩ thuật bắn súng tiểu liên AK” (7 tiết); (3) hai nội dung trên có số tiết thực hành bằng nhau. Kết luận nào đúng?", "options": ["Nhận định (2) và (3) đúng; nhận định (1) sai", "Nhận định (1) và (3) đúng; nhận định (2) sai", "Cả ba nhận định (1), (2) và (3) đều đúng", "Nhận định (1) và (2) đúng; nhận định (3) sai"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 11: 3 tiết lí thuyết, 4 tiết thực hành; lớp 12: 1 tiết lí thuyết, 6 tiết thực hành).", "explanation": ""}, {"id": 39, "set": 9, "number": 39, "level": "Vận dụng cao", "text": "Kế hoạch dạy học lớp 12 của một giáo viên ghi: (1) “Kĩ thuật bắn súng tiểu liên AK” 7 tiết, gồm 1 tiết lí thuyết và 6 tiết thực hành; (2) “Truyền thống và nghệ thuật đánh giặc giữ nước của địa phương” 4 tiết lí thuyết; (3) “Chạy vũ trang” 4 tiết thực hành. Đối chiếu Chương trình, nội dung nào chưa đúng?", "options": ["Nội dung (1), vì “Kĩ thuật bắn súng tiểu liên AK” gồm 3 tiết lí thuyết và 4 tiết thực hành", "Nội dung (3), vì “Chạy vũ trang” gồm 1 tiết lí thuyết và 3 tiết thực hành", "Nội dung (2), vì nội dung về truyền thống địa phương gồm 2 tiết lí thuyết và 2 tiết thực hành", "Không có nội dung nào chưa đúng, cả ba đều khớp với Chương trình"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 12).", "explanation": ""}, {"id": 40, "set": 9, "number": 40, "level": "Vận dụng cao", "text": "Tổ chuyên môn đề xuất phương án đánh giá: (1) kết hợp đánh giá của giáo viên với tự đánh giá của học sinh; (2) chỉ dùng trắc nghiệm khách quan, bỏ hẳn tự luận và thực hành; (3) nội dung đánh giá định kì chú trọng đến nhận thức và kĩ năng thực hành. Đối chiếu phần đánh giá kết quả giáo dục của Chương trình, nhận định nào đúng?", "options": ["Cả (1), (2) và (3) đều phù hợp", "(1) và (3) phù hợp; (2) không phù hợp", "(1) và (2) phù hợp; (3) không phù hợp", "(2) và (3) phù hợp; (1) không phù hợp"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VII (kết hợp trắc nghiệm khách quan và tự luận; kiểm tra miệng, viết, thực hành, dự án nghiên cứu).", "explanation": ""}, {"id": 41, "set": 10, "number": 1, "level": "Nhận biết", "text": "Thông tư số 46/2020/TT-BGDĐT được ban hành căn cứ vào những luật nào?", "options": ["Luật Nghĩa vụ quân sự năm 2015 và Luật Giáo dục năm 2005", "Luật An ninh quốc gia năm 2004 và Luật Nhà giáo năm 2025", "Luật Quốc phòng năm 2018 và Luật Giáo dục năm 2019", "Luật Giáo dục quốc phòng và an ninh, Luật Giáo dục"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, phần căn cứ ban hành.", "explanation": ""}, {"id": 42, "set": 10, "number": 2, "level": "Nhận biết", "text": "Theo Chương trình, nội dung “Kĩ thuật cấp cứu và chuyển thương” ở lớp 10 có thời lượng bao nhiêu tiết?", "options": ["4 tiết thực hành", "3 tiết thực hành", "2 tiết lí thuyết", "4 tiết lí thuyết"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 10).", "explanation": ""}, {"id": 43, "set": 10, "number": 3, "level": "Nhận biết", "text": "Theo Chương trình, nội dung “Giới thiệu một số loại súng bộ binh, thuốc nổ, vật cản và vũ khí tự tạo” ở lớp 11 có tổng thời lượng bao nhiêu tiết?", "options": ["4 tiết", "7 tiết", "5 tiết", "3 tiết"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 11).", "explanation": ""}, {"id": 44, "set": 10, "number": 4, "level": "Nhận biết", "text": "Theo Chương trình, nội dung “Truyền thống và nghệ thuật đánh giặc giữ nước của địa phương” ở lớp 12 có thời lượng bao nhiêu tiết?", "options": ["3 tiết lí thuyết", "4 tiết lí thuyết", "2 tiết lí thuyết", "4 tiết thực hành"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 12).", "explanation": ""}, {"id": 45, "set": 10, "number": 5, "level": "Nhận biết", "text": "Theo Chương trình, nội dung “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” được dạy ở lớp nào?", "options": ["Cả ba lớp", "Lớp 11", "Lớp 10", "Lớp 12"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.1, V.2.", "explanation": ""}, {"id": 46, "set": 10, "number": 6, "level": "Nhận biết", "text": "Theo Chương trình, nội dung “Tìm và giữ phương hướng” ở lớp 12 có thời lượng bao nhiêu tiết?", "options": ["3 tiết thực hành", "4 tiết thực hành", "2 tiết lí thuyết", "2 tiết thực hành"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 12).", "explanation": ""}, {"id": 47, "set": 10, "number": 7, "level": "Nhận biết", "text": "Theo bảng nội dung khái quát của Chương trình, chủ đề “Chiến thuật bộ binh” gồm bao nhiêu nội dung?", "options": ["6 nội dung", "4 nội dung", "5 nội dung", "3 nội dung"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.1.", "explanation": ""}, {"id": 48, "set": 10, "number": 8, "level": "Nhận biết", "text": "Thông tư số 46/2020/TT-BGDĐT do ai thay mặt Bộ trưởng kí ban hành?", "options": ["Thứ trưởng Phạm Ngọc Thưởng", "Thứ trưởng Nguyễn Hữu Độ", "Thứ trưởng Nguyễn Văn Phúc", "Thứ trưởng Hoàng Minh Sơn"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, phần chữ kí (KT. Bộ trưởng, Thứ trưởng).", "explanation": ""}, {"id": 49, "set": 10, "number": 9, "level": "Thông hiểu", "text": "Theo Điều 4 Thông tư số 46/2020/TT-BGDĐT, những ai có trách nhiệm thi hành Thông tư ở địa phương?", "options": ["Chủ tịch Hội đồng nhân dân cấp tỉnh; Chủ tịch Uỷ ban Mặt trận Tổ quốc cấp tỉnh; Bí thư Đoàn thanh niên các trường", "Trưởng ban đại diện cha mẹ học sinh; Chủ tịch công đoàn nhà trường; Tổ trưởng chuyên môn các trường trung học phổ thông", "Chỉ huy trưởng Bộ chỉ huy quân sự cấp tỉnh; Giám đốc Công an cấp tỉnh; Chỉ huy trưởng Ban chỉ huy quân sự cấp xã", "Chủ tịch Uỷ ban nhân dân cấp tỉnh; Giám đốc sở giáo dục và đào tạo; Hiệu trưởng các trường trung học phổ thông"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Điều 4.", "explanation": ""}, {"id": 50, "set": 10, "number": 10, "level": "Thông hiểu", "text": "Nội dung “liên thông” trong quan điểm “tính mở, liên thông” của Chương trình được hiểu như thế nào?", "options": ["Bài giảng có tính liên thông, bổ trợ kiến thức từ lớp 10 đến lớp 12", "Kết quả môn học được dùng thay cho việc thực hiện nghĩa vụ quân sự", "Học sinh được miễn học lớp 11 nếu đã đạt kết quả tốt ở lớp 10", "Nội dung của ba lớp giống hệt nhau để học sinh ôn tập nhiều lần"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục II.5.", "explanation": ""}, {"id": 51, "set": 10, "number": 11, "level": "Thông hiểu", "text": "Yêu cầu “Nêu được nội dung cơ bản của Luật Giáo dục quốc phòng và an ninh, Luật Sĩ quan Quân đội nhân dân Việt Nam, Luật Công an nhân dân, Luật Nghĩa vụ quân sự…” thuộc năng lực đặc thù nào?", "options": ["Năng lực giao tiếp và hợp tác", "Vận dụng kiến thức, kĩ năng quân sự đã học vào cuộc sống", "Nhận thức các vấn đề về quốc phòng, an ninh", "Năng lực tự chủ và tự học"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục IV.2.", "explanation": ""}, {"id": 52, "set": 10, "number": 12, "level": "Thông hiểu", "text": "Trong các yêu cầu cần đạt dưới đây, yêu cầu nào được Chương trình xếp vào năng lực vận dụng kiến thức, kĩ năng quân sự đã học vào cuộc sống?", "options": ["Phân tích và trình bày được những vấn đề cơ bản về chủ quyền lãnh thổ, biên giới quốc gia của Việt Nam hiện nay", "Trình bày được những kĩ năng cơ bản về điều lệnh đội ngũ, kĩ thuật chiến đấu bộ binh, chiến thuật bộ binh", "Thực hiện được pháp luật về trật tự an toàn giao thông, bảo vệ môi trường, phòng chống ma tuý, an ninh mạng", "Nêu được quy định của pháp luật về tệ nạn xã hội và trách nhiệm của công dân trong phòng chống tội phạm"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục IV.2.", "explanation": ""}, {"id": 53, "set": 10, "number": 13, "level": "Thông hiểu", "text": "Theo bảng nội dung khái quát, chủ đề “Một số hiểu biết về phòng thủ dân sự, kiến thức phổ thông về phòng không nhân dân” gồm những nội dung nào?", "options": ["Thường thức phòng tránh bom, mìn, đạn, thiên tai, dịch bệnh, cháy nổ; Kĩ thuật cấp cứu và chuyển thương; Kiến thức phổ thông về phòng không nhân dân", "Kĩ thuật sử dụng lựu đạn; Kĩ thuật bắn súng tiểu liên AK; Chạy vũ trang; Giới thiệu một số loại súng bộ binh, thuốc nổ, vật cản và vũ khí tự tạo dùng trong chiến đấu", "Đội ngũ từng người không có súng; Đội ngũ tiểu đội; Các tư thế, động tác cơ bản vận động trong chiến đấu; Lợi dụng địa hình, địa vật; Tìm và giữ phương hướng", "Ma tuý, tác hại của ma tuý; Phòng, chống vi phạm pháp luật về trật tự an toàn giao thông; Một số vấn đề về vi phạm pháp luật bảo vệ môi trường; An ninh mạng"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.1.", "explanation": ""}, {"id": 54, "set": 10, "number": 14, "level": "Thông hiểu", "text": "Theo bảng nội dung khái quát, nhóm nội dung nào thuộc chủ đề “Một số hiểu biết chung về quốc phòng và an ninh” được dạy ở lớp 12?", "options": ["Điều lệnh quản lý bộ đội; Đội ngũ từng người không có súng; Đội ngũ tiểu đội; Kĩ thuật cấp cứu và chuyển thương; Phòng không nhân dân", "Bảo vệ Tổ quốc sau năm 1975; Tổ chức Quân đội và Công an; Công tác tuyển sinh, đào tạo; “Diễn biến hoà bình”; Truyền thống địa phương", "Bảo vệ chủ quyền lãnh thổ, biên giới; Phòng chống tệ nạn xã hội; Bảo vệ môi trường; Quản lý vũ khí, vật liệu nổ; Luật Nghĩa vụ quân sự", "Lịch sử, truyền thống lực lượng vũ trang; Một số luật về quốc phòng và an ninh; Ma tuý; Trật tự an toàn giao thông; An ninh quốc gia; An ninh mạng"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.1 (nội dung 12 đến 16).", "explanation": ""}, {"id": 55, "set": 10, "number": 15, "level": "Thông hiểu", "text": "Yêu cầu cần đạt nào sau đây thuộc nội dung “Nội dung cơ bản một số luật về quốc phòng và an ninh Việt Nam” ở lớp 10?", "options": ["Nhận biết được cấp bậc quân hàm, quân hiệu, phù hiệu, trang phục của Quân đội và Công an", "Qua nghiên cứu nội dung luật, có định hướng nghề nghiệp trong Quân đội, Công an", "Xác định và thực hiện được trách nhiệm của công dân trong bảo vệ biên giới quốc gia", "Biết đăng ký và thực hiện nghĩa vụ quân sự theo quy định của Luật Nghĩa vụ quân sự"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 10).", "explanation": ""}, {"id": 56, "set": 10, "number": 16, "level": "Thông hiểu", "text": "Yêu cầu cần đạt nào sau đây thuộc nội dung “Ma tuý, tác hại của ma tuý” ở lớp 10?", "options": ["Nêu được nội dung cơ bản, ý nghĩa của môi trường trong pháp luật", "Phân tích được tác hại của ma tuý và các con đường gây nghiện", "Nêu được một số loại hình tội phạm, đặc biệt là tội phạm công nghệ cao", "Phân tích được tác hại của bom, mìn, đạn, vũ khí hoá học, sinh học"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 10).", "explanation": ""}, {"id": 57, "set": 10, "number": 17, "level": "Thông hiểu", "text": "Yêu cầu cần đạt của nội dung “Phòng, chống vi phạm pháp luật về trật tự an toàn giao thông” ở lớp 10 bao gồm điều gì?", "options": ["Thực hành điều khiển xe mô tô trên sa hình và thi lấy giấy phép lái xe ngay tại trường trung học phổ thông", "Thuộc lòng toàn bộ các điều, khoản và mức xử phạt vi phạm hành chính trong lĩnh vực giao thông đường bộ", "Tham gia cùng lực lượng chức năng xử phạt người vi phạm pháp luật giao thông trên địa bàn nơi cư trú", "Tự giác tuân thủ pháp luật về an toàn giao thông và biết tuyên truyền vận động mọi người chấp hành"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 10).", "explanation": ""}, {"id": 58, "set": 10, "number": 18, "level": "Thông hiểu", "text": "Trong yêu cầu cần đạt của nội dung “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” ở lớp 11, vấn đề nào được Chương trình nhấn mạnh là “đặc biệt”?", "options": ["Chủ quyền 02 quần đảo Hoàng Sa và Trường Sa", "Tổ chức biên chế của các đồn biên phòng", "Lịch sử hình thành các tỉnh biên giới phía Bắc", "Số lượng mốc quốc giới trên toàn tuyến biên giới"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 11).", "explanation": ""}, {"id": 59, "set": 10, "number": 19, "level": "Thông hiểu", "text": "Yêu cầu cần đạt của nội dung “Một số vấn đề về vi phạm pháp luật bảo vệ môi trường” ở lớp 11 đề cập đến những vấn đề nào?", "options": ["An ninh môi trường, biến đổi khí hậu, an ninh lương thực, thiên tai, dịch bệnh, di cư tự do", "Tổ chức, biên chế của lực lượng cảnh sát môi trường và quy trình điều tra các vụ án hình sự về môi trường", "Phương pháp trồng rừng phòng hộ, kĩ thuật canh tác trên đất dốc và bảo tồn các loài động vật hoang dã", "Kĩ thuật xử lí rác thải công nghiệp, công nghệ tái chế nhựa, quy trình vận hành nhà máy xử lí nước thải"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 11).", "explanation": ""}, {"id": 60, "set": 10, "number": 20, "level": "Thông hiểu", "text": "Yêu cầu cần đạt nào sau đây thuộc nội dung “Tổ chức Quân đội nhân dân Việt Nam và Công an nhân dân Việt Nam” ở lớp 12?", "options": ["Nêu được hệ thống nhà trường trong Quân đội, Công an và công tác tuyển sinh vào các trường quân đội, công an", "Nêu được những nét chính về lịch sử, bản chất, truyền thống anh hùng của Quân đội nhân dân, Công an nhân dân và Dân quân tự vệ", "Nhận biết được cấp bậc quân hàm, quân hiệu, phù hiệu, trang phục của Quân đội và Công an", "Nêu được một số nội dung chính trong Điều lệnh quản lý bộ đội và Điều lệnh Công an nhân dân; biết vận dụng vào cuộc sống"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 12).", "explanation": ""}, {"id": 61, "set": 10, "number": 21, "level": "Thông hiểu", "text": "Theo yêu cầu cần đạt của nội dung “Kĩ thuật bắn súng tiểu liên AK” ở lớp 12, học sinh biết thực hành bắn loại mục tiêu nào?", "options": ["Mục tiêu cố định ban ngày", "Mục tiêu ẩn hiện ban đêm", "Mục tiêu di động ban ngày", "Mục tiêu cố định ban đêm"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 12).", "explanation": ""}, {"id": 62, "set": 10, "number": 22, "level": "Thông hiểu", "text": "Về việc vận dụng các phương pháp giáo dục, định hướng chung của Chương trình nêu điều gì?", "options": ["Chỉ tổ chức hình thức học cá nhân trong lớp, không tổ chức học nhóm và không học ở ngoài lớp học", "Thay thế hoàn toàn các phương pháp dạy học truyền thống bằng việc cho học sinh tự học qua mạng", "Mỗi chủ đề chỉ được dùng một phương pháp dạy học đã được quy định sẵn trong sách giáo viên của môn học", "Vận dụng linh hoạt, sáng tạo; có thể phối hợp nhiều phương pháp dạy học trong một chủ đề"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VI.1.2.", "explanation": ""}, {"id": 63, "set": 10, "number": 23, "level": "Thông hiểu", "text": "Về hình thức đánh giá kết quả giáo dục, Chương trình yêu cầu kết hợp những yếu tố nào?", "options": ["Đánh giá thường xuyên với định kì; đánh giá của giáo viên với tự đánh giá của học sinh; kiểm tra miệng, viết", "Đánh giá bằng điểm rèn luyện với điểm chuyên cần; bình bầu của tập thể lớp với nhận xét của đoàn thanh niên", "Đánh giá cuối cấp với thi tốt nghiệp; thi học sinh giỏi với hội thao giáo dục quốc phòng và an ninh cấp tỉnh", "Đánh giá của giáo viên với đánh giá của cha mẹ học sinh; kiểm tra thể lực với kiểm tra sức khoẻ định kì hằng năm"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VII.", "explanation": ""}, {"id": 64, "set": 10, "number": 24, "level": "Thông hiểu", "text": "Về giáo viên, phần hướng dẫn thực hiện Chương trình yêu cầu điều gì ngoài trình độ đào tạo đạt chuẩn hoặc trên chuẩn?", "options": ["Được xếp loại đạt trở lên theo Chuẩn nghề nghiệp giáo viên cơ sở giáo dục phổ thông; được bồi dưỡng, tập huấn", "Phải là sĩ quan Quân đội đang tại ngũ hoặc đã từng phục vụ trong Quân đội ít nhất 05 năm trước khi về trường", "Phải đạt danh hiệu giáo viên dạy giỏi cấp tỉnh trở lên trong vòng 03 năm tính đến thời điểm phân công", "Phải có bằng thạc sĩ trở lên và ít nhất 10 năm kinh nghiệm giảng dạy môn học tại trường trung học phổ thông"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.3.", "explanation": ""}, {"id": 65, "set": 10, "number": 25, "level": "Vận dụng", "text": "Một trường trung học cơ sở (không có cấp trung học phổ thông) hỏi có phải dạy môn Giáo dục quốc phòng và an ninh theo Chương trình ban hành kèm Thông tư số 46/2020/TT-BGDĐT không. Câu trả lời nào đúng?", "options": ["Không, vì Thông tư chỉ áp dụng với trường có cấp trung học phổ thông theo Điều 2", "Không, vì Thông tư chỉ áp dụng với các trường do Bộ Quốc phòng quản lý", "Có, nhưng trường trung học cơ sở chỉ dạy phần lí thuyết của Chương trình lớp 10", "Có, vì Thông tư áp dụng với mọi cơ sở giáo dục phổ thông từ tiểu học đến trung học phổ thông"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Điều 2.", "explanation": ""}, {"id": 66, "set": 10, "number": 26, "level": "Vận dụng", "text": "Một giáo viên xếp nội dung “Kĩ thuật sử dụng lựu đạn” vào chương trình lớp 12 để dạy cùng bài bắn súng. Đối chiếu Chương trình, cách xếp này như thế nào?", "options": ["Chưa đúng, vì nội dung này thuộc lớp 11", "Chưa đúng, vì nội dung này thuộc lớp 10", "Đúng, vì nội dung này thuộc lớp 12", "Đúng, vì có thể dạy ở bất kì lớp nào"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.1, V.2 (lớp 11).", "explanation": ""}, {"id": 67, "set": 10, "number": 27, "level": "Vận dụng", "text": "Giáo viên dự kiến dạy nội dung “Thường thức phòng tránh một số loại bom, mìn, đạn, vũ khí hoá học, vũ khí sinh học, vũ khí công nghệ cao, thiên tai, dịch bệnh và cháy nổ” ở lớp 10 bằng 3 tiết lí thuyết. Đối chiếu Chương trình, dự kiến này như thế nào?", "options": ["Chưa phù hợp, vì nội dung này gồm 1 tiết lí thuyết và 2 tiết thực hành", "Phù hợp, vì nội dung này gồm 3 tiết và đều là tiết lí thuyết", "Chưa phù hợp, vì nội dung này gồm 3 tiết và đều là tiết thực hành", "Chưa phù hợp, vì nội dung này gồm 2 tiết lí thuyết và 1 tiết thực hành"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 10).", "explanation": ""}, {"id": 68, "set": 10, "number": 28, "level": "Vận dụng", "text": "Một giáo viên chia 4 tiết thực hành “Đội ngũ từng người không có súng” thành các phần nhỏ, mỗi tháng dạy xen một ít trong suốt năm học. Đối chiếu hướng dẫn thực hiện Chương trình, cách làm này như thế nào?", "options": ["Phù hợp, vì Chương trình giao giáo viên toàn quyền quyết định", "Chưa phù hợp, vì bài thực hành phải dạy vào dịp nghỉ hè", "Chưa phù hợp, vì bài thực hành dạy tập trung, dứt điểm theo bài", "Phù hợp, vì bài thực hành phải dạy rải đều trong cả năm học"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.5.1.", "explanation": ""}, {"id": 69, "set": 10, "number": 29, "level": "Vận dụng", "text": "Một giáo viên cho rằng động từ “đánh giá được” trong yêu cầu cần đạt thuộc mức Vận dụng. Theo bảng động từ mô tả mức độ của Chương trình, nhận định nào đúng?", "options": ["Chưa đúng, vì “đánh giá được” được xếp ở mức Hiểu cùng với “thực hiện được”, “xử lý được”", "Đúng, vì “đánh giá được” được xếp ở mức Vận dụng cùng với “thực hành được”, “áp dụng được”", "Đúng, vì mọi động từ có chữ “đánh giá” đều thuộc mức cao nhất của bảng tổng hợp", "Chưa đúng, vì “đánh giá được” được xếp ở mức Biết cùng với “nêu được”, “so sánh được”"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.1.2.", "explanation": ""}, {"id": 70, "set": 10, "number": 30, "level": "Vận dụng", "text": "Cuối học kì, giáo viên tổ chức kiểm tra thực hành và phối hợp với kết quả đánh giá thường xuyên. Theo Chương trình, thông tin thu được dùng để làm gì?", "options": ["Xét miễn nghĩa vụ quân sự cho học sinh đạt điểm cao", "Phân loại học sinh và điều chỉnh phương pháp giáo dục", "Quyết định việc tuyển thẳng vào các trường quân đội", "Xếp hạng thi đua giữa các tổ chuyên môn của trường"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VII.1.", "explanation": ""}, {"id": 71, "set": 10, "number": 31, "level": "Vận dụng", "text": "Nhà trường muốn rà soát, mua sắm bổ sung thiết bị dạy học môn Giáo dục quốc phòng và an ninh. Theo Chương trình, việc này căn cứ vào quy định nào?", "options": ["Danh mục do Ban đại diện cha mẹ học sinh đề xuất và được hội đồng trường thông qua hằng năm", "Danh mục thiết bị dạy học tối thiểu môn học do Bộ trưởng Bộ Giáo dục và Đào tạo quy định", "Danh mục do từng giáo viên tự lập, không cần đối chiếu với quy định của cơ quan quản lý giáo dục", "Danh mục vũ khí, trang bị chiến đấu của các đơn vị bộ đội chủ lực do Bộ trưởng Bộ Quốc phòng quy định"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.4.", "explanation": ""}, {"id": 72, "set": 10, "number": 32, "level": "Vận dụng", "text": "Khi dạy nội dung “Lợi dụng địa hình, địa vật” ở lớp 11, giáo viên cần hướng tới yêu cầu cần đạt nào về thực hành?", "options": ["Biết thực hành bắn trúng mục tiêu cố định ban ngày bằng súng tiểu liên AK", "Thực hành được các động tác kĩ thuật phù hợp với các loại địa hình, địa vật", "Biết cách điều khiển, tập hợp đội hình cơ bản của tiểu đội trong hoạt động chung", "Thực hành được động tác đứng, quỳ, nằm ném lựu đạn trúng đích theo điều kiện giảng đường"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 11).", "explanation": ""}, {"id": 73, "set": 10, "number": 33, "level": "Vận dụng", "text": "Giáo viên chuẩn bị bài kiểm tra thực hành nội dung “Kĩ thuật cấp cứu và chuyển thương” ở lớp 10. Theo yêu cầu cần đạt, nhóm kĩ năng nào phù hợp để kiểm tra?", "options": ["Tập hợp đội hình tiểu đội; đi đều, đứng lại; quay tại chỗ; chào khi không có súng", "Tìm và giữ phương hướng; chạy vũ trang; vận động vào gần địch trên các loại địa hình", "Cầm máu tạm thời, cố định xương gãy, hô hấp nhân tạo, băng bó, chuyển thương", "Tháo, lắp súng tiểu liên AK; ngắm bắn mục tiêu cố định; ném lựu đạn ở tư thế đứng"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 10).", "explanation": ""}, {"id": 74, "set": 10, "number": 34, "level": "Vận dụng", "text": "Trường trung học phổ thông A dự định tự ban hành quy chế riêng để xếp loại kết quả môn Giáo dục quốc phòng và an ninh, không theo quy định chung. Đối chiếu Chương trình, nhận định nào đúng?", "options": ["Đúng, vì Chương trình giao mỗi trường tự ban hành quy chế đánh giá riêng cho môn học", "Đúng, vì môn học có tính đặc thù quân sự nên không áp dụng quy chế đánh giá chung", "Không đúng, vì việc đánh giá kết quả môn học do cơ quan quân sự địa phương thực hiện", "Không đúng, vì việc đánh giá thực hiện theo quy chế chung của Bộ Giáo dục và Đào tạo"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VII.2.", "explanation": ""}, {"id": 75, "set": 10, "number": 35, "level": "Vận dụng", "text": "Một giáo viên chỉ dùng một bài kiểm tra viết cuối kì để đánh giá kết quả môn học của học sinh. Đối chiếu phần đánh giá kết quả giáo dục của Chương trình, nhận xét nào đúng?", "options": ["Chưa phù hợp, vì Chương trình không cho phép sử dụng hình thức kiểm tra viết", "Phù hợp, vì Chương trình chỉ yêu cầu một bài kiểm tra viết vào cuối mỗi học kì", "Phù hợp, vì đánh giá thường xuyên không áp dụng với môn học có nội dung thực hành", "Chưa phù hợp, vì cần kết hợp đánh giá thường xuyên với đánh giá định kì cuối kì"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VII.", "explanation": ""}, {"id": 76, "set": 10, "number": 36, "level": "Vận dụng", "text": "Trường B tổ chức cho học sinh hội thao giáo dục quốc phòng và an ninh kết hợp tham quan đơn vị quân đội. Một phụ huynh cho rằng đây là hoạt động ngoài lề, không thuộc phương pháp của môn học. Theo Chương trình, nhận định nào đúng?", "options": ["Phụ huynh nhận định đúng, vì môn học chỉ được tổ chức bằng các tiết lí thuyết ở trên lớp", "Phụ huynh nhận định chưa đúng, vì hội thao là hình thức bắt buộc thay cho các bài kiểm tra", "Phụ huynh nhận định chưa đúng, vì đây là phương pháp giáo dục đặc thù của môn học", "Phụ huynh nhận định đúng, vì hoạt động trải nghiệm chỉ dành cho môn Giáo dục thể chất"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VI.2.4.", "explanation": ""}, {"id": 77, "set": 10, "number": 37, "level": "Vận dụng cao", "text": "Lớp 11 có 10 nội dung dạy học (không tính kiểm tra). Căn cứ bảng thời lượng của Chương trình, cách phân loại nào đúng?", "options": ["7 nội dung chỉ có lí thuyết; 2 nội dung chỉ có thực hành; 1 nội dung có cả lí thuyết và thực hành", "6 nội dung chỉ có lí thuyết; 2 nội dung chỉ có thực hành; 2 nội dung có cả lí thuyết và thực hành", "5 nội dung chỉ có lí thuyết; 3 nội dung chỉ có thực hành; 2 nội dung có cả lí thuyết và thực hành", "6 nội dung chỉ có lí thuyết; 3 nội dung chỉ có thực hành; 1 nội dung có cả lí thuyết và thực hành"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 11): chỉ thực hành gồm “Lợi dụng địa hình, địa vật”, “Nhìn, nghe, phát hiện địch…”; có cả hai gồm nội dung về súng bộ binh và lựu đạn.", "explanation": ""}, {"id": 78, "set": 10, "number": 38, "level": "Vận dụng cao", "text": "Cho ba nhận định về chương trình lớp 10: (1) sáu nội dung đầu thuộc chủ đề “Một số hiểu biết chung về quốc phòng và an ninh”, mỗi nội dung 2 tiết lí thuyết; (2) “Một số nội dung Điều lệnh quản lý bộ đội và Điều lệnh Công an nhân dân” có 2 tiết thực hành; (3) “Các tư thế, động tác cơ bản vận động trong chiến đấu” có 3 tiết thực hành. Kết luận nào đúng?", "options": ["Nhận định (2) và (3) đúng; nhận định (1) sai", "Cả ba nhận định (1), (2) và (3) đều đúng", "Nhận định (1) và (3) đúng; nhận định (2) sai", "Nhận định (1) và (2) đúng; nhận định (3) sai"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 10): nội dung về điều lệnh có 2 tiết lí thuyết.", "explanation": ""}, {"id": 79, "set": 10, "number": 39, "level": "Vận dụng cao", "text": "Để thể hiện tính liên thông của chủ đề “Chiến thuật bộ binh” từ lớp 10 đến lớp 12, trình tự nội dung nào đúng với Chương trình?", "options": ["Lớp 10: Nhìn, nghe, phát hiện địch… → lớp 11: Tìm và giữ phương hướng; Các tư thế, động tác cơ bản vận động trong chiến đấu → lớp 12: Lợi dụng địa hình, địa vật; Vận dụng các tư thế, động tác", "Lớp 10: Lợi dụng địa hình, địa vật → lớp 11: Các tư thế, động tác cơ bản vận động trong chiến đấu; Tìm và giữ phương hướng → lớp 12: Nhìn, nghe, phát hiện địch…; Vận dụng các tư thế, động tác", "Lớp 10: Tìm và giữ phương hướng → lớp 11: Vận dụng các tư thế, động tác; Lợi dụng địa hình, địa vật → lớp 12: Các tư thế, động tác cơ bản vận động trong chiến đấu; Nhìn, nghe, phát hiện địch…", "Lớp 10: Các tư thế, động tác cơ bản vận động trong chiến đấu → lớp 11: Lợi dụng địa hình, địa vật; Nhìn, nghe, phát hiện địch… → lớp 12: Tìm và giữ phương hướng; Vận dụng các tư thế, động tác"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.1.", "explanation": ""}, {"id": 80, "set": 10, "number": 40, "level": "Vận dụng cao", "text": "Chủ đề “Kĩ thuật chiến đấu bộ binh” gồm bốn nội dung: súng bộ binh, thuốc nổ, vật cản và vũ khí tự tạo (3 tiết lí thuyết, 4 tiết thực hành); lựu đạn (1 lí thuyết, 4 thực hành); bắn súng tiểu liên AK (1 lí thuyết, 6 thực hành); chạy vũ trang (1 lí thuyết, 3 thực hành). Tổng thời lượng của chủ đề này trong cả cấp học là bao nhiêu?", "options": ["21 tiết, gồm 6 tiết lí thuyết và 15 tiết thực hành", "23 tiết, gồm 7 tiết lí thuyết và 16 tiết thực hành", "23 tiết, gồm 6 tiết lí thuyết và 17 tiết thực hành", "25 tiết, gồm 8 tiết lí thuyết và 17 tiết thực hành"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 11, lớp 12): 3 + 1 + 1 + 1 = 6; 4 + 4 + 6 + 3 = 17.", "explanation": ""}];</script><script>const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='gdqp-de910-tt46-80-20261126-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{wrong:[],bookmarks:[],history:[]}}catch{db={wrong:[],bookmarks:[],history:[]}}let active=null,timer=null;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}};const bank=QUESTIONS.filter(q=>!q.placeholder);const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function dashboard(){clearInterval(timer);active=null;$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">GDQP&AN · Tài liệu ôn luyện được cung cấp</div><h1>Ôn luyện GDQP&AN · Đề 9–10 · Thông tư 46</h1><p>80 câu hỏi · Hai đề số 9 và 10 về Thông tư 46, mỗi đề 40 câu. Luyện từng câu, tra cứu tài liệu và xem lại kết quả.</p><button class="lime" data-start="practice">Luyện tổng hợp 80 câu →</button></div><div class="emblem">★<small>ÔN TẬP KIẾN THỨC</small></div></section><section class="stats"><div class="stat"><strong>80</strong><span class="muted">Câu hỏi đầy đủ</span></div><div class="stat"><strong>${db.history.length}</strong><span class="muted">Lượt đã hoàn thành</span></div><div class="stat"><strong>${db.wrong.length}</strong><span class="muted">Câu cần ôn lại</span></div><div class="stat"><strong>${db.bookmarks.length}</strong><span class="muted">Câu đã đánh dấu</span></div></section><div class="notice">Nội dung, đáp án và nguồn dẫn được nhập từ file anh cung cấp, chưa thẩm định lại. Nguồn đối chiếu được hiển thị khi kiểm tra đáp án. Đáp án đã được đối chiếu giữa nội dung từng câu và bảng đáp án cuối mỗi đề; chưa thẩm định lại kiến thức và hiệu lực văn bản. Vị trí phương án được đảo khi luyện. Thời gian thi thử do anh chọn, không phải thời gian quy định trong tài liệu.</div><div class="panel"><h3>Thiết lập thời gian mỗi đề</h3><select id="duration" aria-label="Thời gian thi thử"><option value="40" selected>40 phút</option><option value="50">50 phút</option><option value="60">60 phút</option></select></div><div class="tools"><button class="primary" data-start="wrong">↻ Ôn câu sai (${db.wrong.length})</button><button data-start="bookmarks">★ Câu đánh dấu (${db.bookmarks.length})</button></div><h2 style="margin-top:25px">Chọn bộ đề</h2><section class="grid">${[9,10].map(n=>`<article class="card"><span class="tag">ĐỀ ${n} · 40 CÂU</span><h3>Đề ${n}</h3><button data-topic="${n}">Luyện từng câu →</button><button class="primary" data-exam="${n}">Thi thử đề ${n} →</button></article>`).join('')}<article class="card"><h3>Củng cố kiến thức</h3><button data-start="wrong">Ôn câu sai (${db.wrong.length})</button><button data-start="bookmarks">Câu đánh dấu (${db.bookmarks.length})</button></article></section><h2 style="margin-top:30px">Tra cứu câu hỏi</h2><div class="tools"><input id="search" placeholder="Tìm nội dung câu hỏi…" aria-label="Tìm câu hỏi"><select id="level" aria-label="Mức độ"><option value="">Tất cả mức độ</option>${[...new Set(bank.map(q=>q.level))].map(l=>`<option>${esc(l)}</option>`).join('')}</select><button id="browse">Tra cứu</button></div><div id="searchResults"></div><h2 style="margin-top:30px">Lịch sử luyện tập</h2>${db.history.slice(0,10).map(h=>`<div class="history row"><span>${esc(h.mode)} · ${esc(h.date)}</span><b>${h.correct}/${h.total} câu đúng · ${h.score}/10</b></div>`).join('')||'<p class="muted">Chưa có lượt hoàn thành.</p>'}<p class="muted">Tiến độ được lưu trên trình duyệt và thiết bị đang sử dụng.</p>`;document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>start('practice',+b.dataset.topic));document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>start('exam',+b.dataset.exam));$('#browse').onclick=browse;$('#search').oninput=browse;$('#level').onchange=browse}
function browse(){let s=$('#search').value.toLocaleLowerCase('vi'),l=$('#level').value;let list=bank.filter(q=>(!l||q.level===l)&&(q.text+' '+q.options.join(' ')).toLocaleLowerCase('vi').includes(s));$('#searchResults').innerHTML=`<p class="muted">${list.length} câu phù hợp</p>`+list.map(q=>`<div class="review-item"><span class="tag">Đề ${q.set} · Câu ${q.number} · ${esc(q.level)}</span><p>${esc(q.text)}</p><details><summary>Xem phương án và đáp án từ tài liệu</summary>${q.options.map((o,i)=>`<p>${'ABCD'[i]}. ${esc(o)} ${i===q.answer?'✓':''}</p>`).join('')}</details></div>`).join('')}
function start(mode,topic){clearInterval(timer);let minutes=Number($('#duration')?.value||50);let qs=mode==='wrong'?bank.filter(q=>db.wrong.includes(q.id)):mode==='bookmarks'?bank.filter(q=>db.bookmarks.includes(q.id)):bank.slice();if(topic)qs=qs.filter(q=>q.set===topic);qs=qs.map(q=>{let opts=shuffle(q.options.map((text,index)=>({text,index})));return {...q,options:opts.map(o=>o.text),answer:opts.findIndex(o=>o.index===q.answer)}});if(!qs.length){alert('Chưa có câu trong danh sách này. Anh hãy luyện hoặc đánh dấu câu trước nhé.');return}if(mode!=='exam')qs=shuffle(qs);active={mode,qs,answers:{},revealed:{},i:0,end:Date.now()+minutes*60000};renderQuiz();if(mode==='exam')timer=setInterval(()=>{if(!active)return;let remain=Math.max(0,Math.ceil((active.end-Date.now())/1000));let el=$('#clock');if(el)el.textContent=fmt(remain);if(!remain)finish(false)},1000)}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function recordAnswer(q,answer){if(answer===undefined)return;if(answer===q.answer)db.wrong=db.wrong.filter(id=>id!==q.id);else if(!db.wrong.includes(q.id))db.wrong.push(q.id);save()}
function renderQuiz(){let a=active,q=a.qs[a.i],ans=a.answers[q.id],show=a.revealed[q.id],done=Object.keys(a.answers).length;$('#app').innerHTML=`<div class="row"><div><div class="eyebrow" style="color:#627d50">${a.mode==='exam'?`THI THỬ · BỘ ĐỀ ${a.qs[0].set}`:'LUYỆN TẬP · PHẢN HỒI TỪNG CÂU'}</div><h2>Vững kiến thức, tự tin hơn</h2></div><button id="exit">Thoát</button></div><div class="quiz"><section class="panel"><div class="row"><span class="tag">Câu ${a.i+1}/${a.qs.length} · ${esc(q.level)}</span><button id="bookmark" aria-label="Đánh dấu câu">${db.bookmarks.includes(q.id)?'★ Đã đánh dấu':'☆ Đánh dấu'}</button></div><div class="question">${esc(q.text)}</div>${q.options.map((o,i)=>`<button class="option ${ans===i?'selected':''} ${show&&i===q.answer?'correct':''} ${show&&ans===i&&i!==q.answer?'wrong':''}" data-option="${i}" ${show?'disabled':''}><b>${'ABCD'[i]}</b><span>${esc(o)}${show&&i===q.answer?' ✓ Đáp án đúng':''}${show&&ans===i&&i!==q.answer?' ✗ Anh chọn':''}</span></button>`).join('')}${show?`<div class="answer-note">${q.explanation?`<p>${esc(q.explanation)}</p>`:''}<b>${ans===q.answer?'✓ ĐÚNG — theo đáp án tài liệu':'✗ SAI — Đáp án đúng: '+ 'ABCD'[q.answer]}</b><div class="muted">Nguồn dẫn trong file: ${esc(q.source)} · Câu gốc ${q.number}. Chưa thẩm định nguồn.</div></div>`:''}<div class="row" style="margin-top:22px"><button id="prev" ${a.i===0?'disabled':''}>← Trước</button><button id="next" ${a.i===a.qs.length-1?'disabled':''}>Tiếp →</button></div></section><aside class="panel">${a.mode==='exam'?`<div class="muted">Thời gian còn lại</div><div class="timer" id="clock">${fmt(Math.max(0,Math.ceil((a.end-Date.now())/1000)))}</div>`:'<h3>Tiến độ luyện tập</h3>'}<div class="muted">Đã chọn ${done}/${a.qs.length} câu</div><div class="progress"><i style="width:${done/a.qs.length*100}%"></i></div><div class="numbers">${a.qs.map((v,i)=>`<button data-jump="${i}" class="${a.answers[v.id]!==undefined?'selected':''} ${i===a.i?'current':''}">${i+1}${db.bookmarks.includes(v.id)?'★':''}</button>`).join('')}</div><button class="primary" style="width:100%" id="finish">${a.mode==='exam'?'Nộp bài':'Kết thúc & xem kết quả'}</button><p class="muted">${a.mode==='exam'?'Đáp án hiển thị sau khi nộp bài.':'Chọn đáp án để xem đúng/sai ngay. Câu sai được lưu tự động.'}</p></aside></div>`;document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{a.answers[q.id]=+b.dataset.option;if(a.mode!=='exam'){a.revealed[q.id]=true;recordAnswer(q,a.answers[q.id]);}renderQuiz()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{a.i=+b.dataset.jump;renderQuiz()});$('#prev').onclick=()=>{a.i--;renderQuiz()};$('#next').onclick=()=>{a.i++;renderQuiz()};if($('#check'))$('#check').onclick=()=>{a.revealed[q.id]=true;renderQuiz()};$('#bookmark').onclick=()=>{db.bookmarks=db.bookmarks.includes(q.id)?db.bookmarks.filter(id=>id!==q.id):[...db.bookmarks,q.id];save();renderQuiz()};$('#exit').onclick=()=>{if(confirm('Thoát lượt đang làm? Câu đã trả lời trong chế độ luyện tập đã được lưu; điểm tổng kết lượt này chưa được lưu.'))dashboard()};$('#finish').onclick=()=>finish(true)}
function finish(ask){if(!active)return;let a=active,missing=a.qs.length-Object.keys(a.answers).length;if(ask&&!confirm(missing?`Còn ${missing} câu chưa chọn. Anh muốn kết thúc và chấm bài?`:'Kết thúc và chấm bài?'))return;clearInterval(timer);let correct=a.qs.filter(q=>a.answers[q.id]===q.answer).length;for(let q of a.qs){recordAnswer(q,a.answers[q.id])}let score=(correct/a.qs.length*10).toFixed(2);db.history.unshift({mode:(a.mode==='exam'?'Thi thử':'Luyện tập')+(a.qs.every(q=>q.set===a.qs[0].set)?' đề '+(a.qs[0].set):' tổng hợp'),date:new Date().toLocaleString('vi-VN'),correct,total:a.qs.length,score});db.history=db.history.slice(0,50);save();$('#app').innerHTML=`<section class="panel score"><span class="tag">ĐÃ HOÀN THÀNH</span><h1>Kết quả của anh</h1><strong>${score}<small style="font-size:20px">/10</small></strong><p>${correct}/${a.qs.length} câu trùng đáp án tài liệu · ${missing} câu chưa trả lời</p><div class="tools" style="justify-content:center"><button class="primary" id="again">Ôn câu sai</button><button id="back">Về tổng quan</button></div><p class="muted">Điểm luyện tập được quy đổi tuyến tính theo số câu đúng, không thay thế thang điểm hội thi.</p></section><h2 style="margin-top:28px">Xem lại bài làm</h2><section class="panel">${a.qs.map(q=>`<div class="review-item"><span class="tag">Đề ${q.set} · Câu ${q.number} · ${a.answers[q.id]===q.answer?'Đúng theo tài liệu':'Cần ôn lại'}</span><p><b>${esc(q.text)}</b></p><p class="muted">Nguồn dẫn trong file: ${esc(q.source)}</p>${q.options.map((o,i)=>`<p style="color:${i===q.answer?'#26763d':a.answers[q.id]===i?'#b35543':'inherit'}">${'ABCD'[i]}. ${esc(o)} ${i===q.answer?'✓ Đáp án tài liệu':''}${a.answers[q.id]===i?' · Anh chọn':''}</p>`).join('')}</div>`).join('')}</section>`;active=null;$('#again').onclick=()=>start('wrong');$('#back').onclick=dashboard;window.scrollTo(0,0)}
$('#home').onclick=$('#logo').onclick=e=>{e.preventDefault();if(!active||confirm('Thoát lượt đang làm? Câu đã trả lời trong chế độ luyện tập đã được lưu; điểm tổng kết lượt này chưa được lưu.'))dashboard()};dashboard();
</script></body></html>
